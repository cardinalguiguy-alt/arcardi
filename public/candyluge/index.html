<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ferme Vallée — La Grande Descente</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Tous les textes sont posés par ui.js/applyLang() depuis js/strings.js.
     Rien de visible n'est écrit en dur ici : la ferme impose sa langue au
     chargement, et la descente doit la suivre. -->

<canvas id="gl"></canvas>

<!-- ------------------------------------------------------------------ HUD --
     ⚠️ IL EST DANS LES COINS, PAS EN COLONNE. Le chantier demande un cadre
     large pour voir le paysage ; un HUD empilé dans l'angle supérieur gauche
     rendrait ce cadrage inutile. Score à gauche, vitesse et chrono à droite,
     palier en bas : le centre du cadre reste vide, c'est-à-dire la piste,
     l'horizon et les montagnes. C'est aussi la disposition de la capture de
     référence, et ce n'est pas un hasard — c'est celle de tous les jeux de
     descente, parce que c'est la seule qui laisse voir la pente. -->
<div id="hud" class="hud">
  <div class="corner tl">
    <div class="plate"><span class="label" id="lScore"></span><span class="val" id="score">0</span></div>
    <div class="plate small"><span class="label" id="lCandies"></span><span class="val" id="candies">0</span></div>
  </div>
  <div class="corner tr">
    <div class="plate speed"><span class="label" id="lSpeed"></span><span class="val" id="speed">0</span></div>
    <div class="plate time"><span class="val" id="time">00:00.000</span></div>
    <!-- Le compteur de chutes (414). Il n'apparaît qu'à partir de la première :
         un « 0 » permanent serait un reproche par anticipation. -->
    <div class="plate small wipes" id="wipesPlate"><span class="label" id="lWipes"></span><span class="val" id="wipes">0</span></div>
  </div>
  <div class="corner bl">
    <div class="wafer"><span class="label" id="lStage"></span><span class="val" id="stage">1</span></div>
  </div>
  <div class="corner br">
    <div class="plate small"><span class="label" id="lBest"></span><span class="val" id="best">--:--.---</span></div>
  </div>

  <!-- La charge du turbo. Elle n'apparaît QUE pendant un dérapage : une jauge
       toujours visible et presque toujours vide est un élément d'interface qui
       ne dit rien 95 % du temps. -->
  <div id="driftBar" class="drift-bar"><div id="driftFill"></div></div>
  <div id="boostTag" class="boost-tag"></div>

  <!-- ⚠️ LES DEUX ANNONCES DU MODÈLE À CHECKPOINTS (414). Elles sont AU CENTRE
       et non dans un coin, ce qui est le seul endroit du cadre qu'on avait
       jusqu'ici gardé vide — et c'est justifié : ce sont les deux seuls
       moments de la descente où le joueur doit lever les yeux de la piste.
       L'une annonce un acquis, l'autre une remise en place ; les deux
       disparaissent d'elles-mêmes. -->
  <div id="cpTag" class="cp-tag"></div>
  <div id="resetTag" class="reset-tag"></div>

  <!-- ⚠️ LA BANNIÈRE D'ARRIVÉE (424). Elle est au centre et NON dans un coin,
       comme les deux annonces ci-dessus et pour la même raison : c'est un des
       rares instants où le joueur doit lever les yeux de la piste. Elle est
       posée APRÈS elles dans le document — si jamais une remise en place et
       l'arrivée se chevauchaient, c'est l'arrivée qui doit passer devant. -->
  <div id="finishTag" class="finish-tag"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════ CHANTIER ═══
     ⚠️ LE MUR DE CHANTIER. Il est posé AVANT l'écran-titre dans le document et
     il est le seul calque visible au chargement : la descente n'est pas
     ouverte au public tant qu'elle se construit.

     ⚠️ IL NE DIT RIEN DU CODE SECRET, ET C'EST TOUT L'INTÉRÊT. Un mur qui
     annoncerait « appuyez sur telle touche pour entrer » ne bloquerait
     personne. Celui qui doit entrer sait ; les autres lisent un panneau poli et
     s'en vont. Voir la porte dérobée dans game.js.

     Le bouton de retour est INDISPENSABLE : sans lui, un joueur qui ouvre la
     descente depuis la ferme se retrouve enfermé dans l'iframe, sans aucun
     moyen de revenir. Un mur n'est pas un cul-de-sac. -->
<div id="construction" class="layer panel visible">
  <div class="site-sign">🚧</div>
  <h1 id="wTitle"></h1>
  <p class="sub" id="wSub"></p>
  <p class="hint" id="wHint"></p>
  <button id="btnConstructionBack" class="ghost"></button>
</div>

<!-- ---------------------------------------------------------------- TITRE -->
<div id="title" class="layer panel">
  <h1 id="tTitle"></h1>
  <p class="sub" id="tSub"></p>
  <div id="loadError" class="error"></div>
  <button id="btnStart"></button>
  <div class="controls">
    <div id="cLane"></div>
    <div id="cJump"></div>
    <div id="cSlide"></div>
    <div id="cPause"></div>
    <div id="cReset"></div>
  </div>
  <p class="hint" id="tHint"></p>
  <p class="hint" id="tHintExit"></p>
  <p class="hint farm" id="tHintFarm"></p>
</div>

<!-- ---------------------------------------------------------------- PAUSE -->
<div id="pause" class="layer panel">
  <h1 id="pTitle"></h1>
  <button id="btnResume"></button>
  <button id="btnQuit" class="ghost"></button>
  <p class="hint" id="pQuitWarn"></p>
</div>

<!-- ------------------------------------------------------------ FIN DE RUN -->
<div id="gameover" class="layer panel">
  <h1 id="oTitle"></h1>
  <p id="overReason" class="sub"></p>
  <div id="newBest" class="newbest"></div>
  <div class="results">
    <div><span id="fLScore"></span><b id="finalScore">0</b></div>
    <div><span id="fLCandies"></span><b id="finalCandies">0</b></div>
    <div><span id="fLTime"></span><b id="finalTime">--:--.---</b></div>
    <div><span id="fLWipes"></span><b id="finalWipes">0</b></div>
    <div><span id="fLBest"></span><b id="finalBest">--:--.---</b></div>
  </div>
  <p class="hint" id="oHint"></p>
  <button id="btnBack"></button>
</div>

<!-- ═══════════════════════════════════════════════════ THREE.JS (ZIP 422) ═══
     ⚠️⚠️ RAPATRIÉ EN LOCAL, ET CE N'EST PAS UNE PRÉCAUTION D'HYGIÈNE : C'EST CE
     QUI DÉBLOQUE TOUT LE RESTE DU ZIP.

     Jusqu'au 421 la descente chargeait r128 depuis cdnjs, sans `integrity`.
     Le problème n'était pas la fragilité du CDN — c'est que **cdnjs ne publie
     que `three.min.js`** et AUCUN des scripts du dossier `examples/js` :
     GLTFLoader, EffectComposer, UnrealBloomPass, ShaderPass. Sans eux, ni
     modèles glTF ni post-traitement. Le contexte de reprise du 421 en
     concluait qu'il fallait d'abord MIGRER vers un three.js moderne.

     ⚠️ CETTE CONCLUSION ÉTAIT FAUSSE, ET C'EST LE SEUL ENDROIT OÙ CE ZIP
     DÉSOBÉIT À SON PLAN. r128 EXPÉDIE elle-même ces fichiers, en scripts
     classiques qui posent `THREE.GLTFLoader` etc. sur le global — ils sont
     simplement absents du miroir cdnjs. Il suffisait donc de les copier depuis
     le paquet npm `three@0.128.0`, ce que fait `public/vendor/three-r128/`.

     Ce qu'on y gagne, et c'est décisif : la migration r128 → r15x+ aurait
     DÉPLACÉ TOUTES LES COULEURS (gestion colorimétrique automatique à partir de
     r152), sur un projet dont les palettes ont été réglées à la main sur quatre
     zips (405-408). On obtient les mêmes fonctionnalités pour zéro déplacement
     de teinte. La migration reste souhaitable un jour, pour `templerun` et
     `labyrinth` ; elle n'est plus un préalable ici.

     ⚠️ L'ORDRE EST OBLIGATOIRE : three.min.js d'abord, les shaders avant les
     passes qui les utilisent, CopyShader avant EffectComposer (qui s'en sert
     pour sa passe de copie finale). Une passe chargée avant son shader ne lève
     PAS d'erreur au chargement — elle échoue à la construction, bien plus tard,
     avec un message qui ne dit pas ça. -->
<script src="../vendor/three-r128/three.min.js"></script>
<script src="../vendor/three-r128/js/shaders/CopyShader.js"></script>
<script src="../vendor/three-r128/js/shaders/LuminosityHighPassShader.js"></script>
<script src="../vendor/three-r128/js/postprocessing/EffectComposer.js"></script>
<script src="../vendor/three-r128/js/postprocessing/RenderPass.js"></script>
<script src="../vendor/three-r128/js/postprocessing/ShaderPass.js"></script>
<script src="../vendor/three-r128/js/postprocessing/MaskPass.js"></script>
<script src="../vendor/three-r128/js/postprocessing/UnrealBloomPass.js"></script>
<script src="../vendor/three-r128/js/loaders/GLTFLoader.js"></script>

<!-- L'ordre compte sur deux points seulement : config.js avant bridge.js (le
     pont retombe sur CFG.COL_* quand la ferme n'envoie pas de tenue), et
     slope.js avant sled.js/world.js (les deux l'interrogent dès leur
     construction). Le reste est indépendant. -->
<script src="js/strings.js"></script>
<script src="js/config.js"></script>
<script src="js/bridge.js"></script>
<script src="js/input.js"></script>
<script src="js/slope.js"></script>
<script src="js/sled.js"></script>
<script src="js/critters.js"></script>
<script src="js/camera.js"></script>
<!-- models.js AVANT world.js : `World.init()` appelle `Models.load()`. -->
<script src="js/models.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
