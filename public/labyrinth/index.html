<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ferme Vallée — Le Labyrinthe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Tous les textes sont posés par ui.js/applyLang() depuis js/strings.js.
     Rien de visible n'est écrit en dur ici : la ferme impose sa langue au
     chargement, et le labyrinthe doit la suivre. -->

<canvas id="gl"></canvas>

<!-- Voile d'angoisse : rougit quand le traqueur approche. Piloté par
     Rules.dread(), donc par la VRAIE distance, jamais par une estimation
     recalculée dans l'interface. -->
<div id="dread"></div>
<div id="hurtFlash"></div>

<!-- ------------------------------------------------------- ZIP 397 : VISÉE --
     Le réticule. Il est DYNAMIQUE : il s'ouvre quand on court (l'arme est
     basse), il rougit quand une créature est à portée d'épée, il devient un
     cercle plein quand l'arbalète est chargée. Un réticule fixe ne dit rien ;
     c'est justement le reproche du 396 (« on sait pas quand on touche »),
     transposé en vue subjective. -->
<div id="reticle"><i class="r-t"></i><i class="r-b"></i><i class="r-l"></i><i class="r-r"></i><i class="r-c"></i></div>

<!-- ------------------------------------------------------------------ HUD -->
<div id="hud" class="layer hud">
  <div class="hud-row">
    <div class="stat"><span class="label" id="lScore"></span><span id="score">0</span></div>
    <div class="stat"><span class="label" id="lShards"></span><span id="shards">0</span></div>
    <div class="stat"><span class="label" id="lBest"></span><span id="best">0</span></div>
    <div class="stat sword"><span id="swordIcon">⚔</span></div>
    <div class="stat bolts" id="boltBox"><span id="bowIcon">➶</span><span id="boltN">0</span></div>
    <!-- Zip 396 : le compte à rebours du renoncement. Il n'apparaît QUE
         pendant la fenêtre, et disparaît dès que la herse est tombée : un
         compteur figé à zéro est une promesse qu'on ne tient plus. -->
    <div class="stat back" id="backBox"><span class="label" id="lBack"></span><span id="backT">15</span></div>
  </div>
  <div class="flame">
    <div class="flame-label" id="lFlame"></div>
    <div class="flame-bar"><div id="flameFill"></div></div>
  </div>
  <div id="hearts" class="hearts"></div>
</div>

<!-- ------------------------------------------------- ZIP 397 : NAVIGATION --
     « Il faut pouvoir naviguer de manière absolument évidente. »

     LA BOUSSOLE est en HAUT, au centre, sous le réticule : c'est là qu'on
     regarde déjà. Elle porte les quatre points cardinaux ET deux repères qui
     ne sont pas cardinaux — la SORTIE et la ROTONDE. Savoir que la sortie est
     au nord-est ne dit rien des trois murs qui séparent : la boussole donne
     donc une DIRECTION, jamais un chemin, exactement comme le phare du 393.

     LA MINICARTE est en bas à droite, orientée « le haut = devant » (une carte
     orientée nord oblige à faire la rotation de tête soi-même, ce qui est très
     exactement le travail qu'on veut éviter au joueur). Sans la carte
     ramassée, elle ne montre QUE les cellules vues. Avec, elle montre tout.
     C'est le bonus, et c'est la différence entre « je suis perdu » et « je
     sais où aller mais pas comment ». -->
<canvas id="compass" width="620" height="34"></canvas>
<div id="miniWrap">
  <canvas id="mini" width="220" height="220"></canvas>
  <div id="miniTag"></div>
</div>

<!-- LE PLAN DÉPLIÉ (touche M). Plein écran, il ne met pas le jeu en pause :
     s'arrêter pour lire une carte dans un labyrinthe où quelque chose vous
     cherche est une DÉCISION, et c'est ce qui la rend intéressante. -->
<div id="mapFull" class="layer">
  <canvas id="mapBig" width="720" height="720"></canvas>
  <p class="hint" id="mapHint"></p>
</div>

<!-- « Cliquez pour jouer » : la capture du pointeur ne peut être redemandée
     que par un geste. Sans ce panneau, un joueur qui appuie sur Échap se
     retrouve incapable de tourner sans savoir pourquoi. -->
<div id="lockHint" class="lockhint"><span id="lockTxt"></span></div>
<!-- ZIP 399 : le compteur d'images. Il n'est pas là pour décorer — c'est le seul
     endroit du projet qui mesure un TEMPS réel : verify-perf.mjs compte ce qu'on
     demande au GPU, jamais ce que le GPU met à le faire (il n'y a pas de GPU
     dans node). Une capture de ce coin-là vaut une heure de suppositions. -->
<div id="perf" class="perf"></div>

<div id="toast" class="toast"></div>

<!-- ----------------------------------------------------------- CHARGEMENT --
     Zip 396. Retour de Guillaume : « revoir la page de lancement qui bug un
     peu avant de s'afficher ». Le titre ne s'affiche plus par défaut : c'est
     CET écran qui est visible à l'ouverture, et game.js ne passe au titre
     qu'une fois la première image 3D réellement rendue. On ne voit donc plus
     ni panneau vide, ni décor en train de pousser derrière. -->
<div id="loading" class="layer panel visible">
  <div class="spin"><i></i><i></i><i></i></div>
  <p class="sub" id="lLoading"></p>
</div>

<!-- ═══════════════════════════════════════════════════════════ CHANTIER ═══
     ⚠️ LE MUR DE CHANTIER (417), REPRIS TEL QUEL DE LA DESCENTE (415).
     Demande de Guillaume : « mettre le labyrinthe derrière le même blocage
     développeur que le jeu de descente, indiquant au visiteur qu'il est encore
     en construction — toujours même commande pour bypass ».

     ⚠️ « MÊME COMMANDE » EST UNE CONTRAINTE FORTE, ET C'EST ELLE QUI DICTE
     TOUT LE RESTE. Un second mur avec un second code serait un second secret à
     retenir, donc un secret oublié. Le raccourci, la fenêtre de 3,5 s, la
     double pression et le halo d'accusé de réception sont donc IDENTIQUES —
     seule la CLÉ de session diffère (`vf-lab-wip` contre `vf-luge-wip`), parce
     que les deux jeux doivent pouvoir être ouverts indépendamment : on peut
     vouloir tester le labyrinthe sans rouvrir la descente au même moment.

     ⚠️ IL EST POSÉ AVANT L'ÉCRAN DE CHARGEMENT DANS LE DOCUMENT, mais c'est
     `game.js` qui décide lequel des deux montre — voir Gate.
     ⚠️ ET LE BOUTON DE RETOUR EST INDISPENSABLE : sans lui, un joueur qui ouvre
     le labyrinthe depuis la ferme se retrouve enfermé dans l'iframe. Un mur
     n'est pas un cul-de-sac. -->
<div id="construction" class="layer panel">
  <div class="site-sign">🚧</div>
  <h1 id="wTitle"></h1>
  <p class="sub" id="wSub"></p>
  <p class="hint" id="wHint"></p>
  <button id="btnConstructionBack" class="ghost"></button>
</div>

<!-- ---------------------------------------------------------------- TITRE -->
<div id="title" class="layer panel">
  <h1 id="tTitle"></h1>
  <p class="sub" id="tSub"></p>
  <div id="loadError" class="error"></div>
  <button id="btnStart"></button>
  <button id="btnExit" class="ghost"></button>
  <div class="controls">
    <div id="cLane"></div>
    <div id="cLook"></div>
    <div id="cStrafe"></div>
    <div id="cHit"></div>
    <div id="cShoot"></div>
    <div id="cUse"></div>
    <div id="cMap"></div>
    <div id="cPause"></div>
    <div id="cBack"></div>
  </div>
  <p class="hint" id="tHint"></p>
  <p class="hint" id="tHintExit"></p>
  <p class="hint farm" id="tHintFarm"></p>
</div>

<!-- ---------------------------------------------------------------- PAUSE -->
<div id="pause" class="layer panel">
  <h1 id="pTitle"></h1>
  <!-- ZIP 399 : l'avis d'effondrement. Il n'apparaît QUE si le chien de garde a
       rendu la souris tout seul, et il explique pourquoi — une souris qui
       revient sans raison est aussi inquiétante qu'une souris confisquée. -->
  <p class="warn" id="hangNotice" style="display:none"></p>
  <button id="btnResume"></button>
  <!-- ZIP 399 : le réglage de qualité. À la pause plutôt qu'à l'écran-titre :
       c'est en jouant qu'on sait si ça rame, et c'est là qu'on veut le changer. -->
  <div class="qual" id="qualBox">
    <span id="qualTitle"></span>
    <div class="qualRow">
      <button class="qbtn" data-q="high" id="qHigh"></button>
      <button class="qbtn" data-q="med"  id="qMed"></button>
      <button class="qbtn" data-q="low"  id="qLow"></button>
    </div>
    <p class="hint" id="qualHint"></p>
  </div>
  <button id="btnQuit" class="ghost"></button>
  <p class="hint" id="pQuitWarn"></p>
</div>

<!-- ------------------------------------------------------ SORTIE RÉUSSIE --
     Pas d'écran de bilan : un bandeau, puis on repart. Voir bridge.js. -->
<div id="win" class="layer win">
  <div class="win-box"><h2>↑</h2></div>
</div>

<!-- ------------------------------------------------------------ GAME OVER -->
<div id="gameover" class="layer panel">
  <h1 id="oTitle"></h1>
  <p id="deathReason" class="sub"></p>
  <div id="newBest" class="newbest">NOUVEAU RECORD</div>
  <div class="results">
    <div><span id="fLScore"></span><b id="finalScore">0</b></div>
    <div><span id="fLShards"></span><b id="finalShards">0</b></div>
    <div><span id="fLDepth"></span><b id="finalDepth">0</b></div>
    <div><span id="fLBest"></span><b id="finalBest">0</b></div>
  </div>
  <button id="btnBack"></button>
</div>

<!-- three.js : build global classique (pas de module). Chargé ICI, dans
     l'iframe, donc jamais dans le bundle Next de la ferme — et un échec de
     CDN ne casse que le labyrinthe. Même version que le défi de fuite (r128) :
     deux versions différentes de three.js dans le même projet finiraient par
     diverger sur un comportement, et personne ne saurait pourquoi. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- ORDRE OBLIGATOIRE : config avant bridge (bridge valide les couleurs reçues
     contre CFG.COL_*), maze et rules avant world (world lit leurs sorties),
     tout avant game. -->
<script src="js/strings.js"></script>
<script src="js/config.js"></script>
<script src="js/bridge.js"></script>
<script src="js/maze.js"></script>
<script src="js/rules.js"></script>
<script src="js/paint.js"></script>
<script src="js/rig.js"></script>
<script src="js/input.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
