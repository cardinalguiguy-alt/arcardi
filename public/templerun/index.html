<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ferme Vallée — Fuite du monde sombre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Tous les textes sont posés par ui.js/applyLang() depuis js/strings.js.
     Rien de visible n'est écrit en dur ici : la ferme impose sa langue au
     chargement, et le défi doit la suivre. -->

<canvas id="gl"></canvas>

<!-- ------------------------------------------------------------------ HUD -->
<div id="hud" class="layer hud">
  <div class="hud-row">
    <div class="stat"><span class="label" id="lScore"></span><span id="score">0</span></div>
    <div class="stat"><span class="label" id="lCoins"></span><span id="coins">0</span></div>
    <div class="stat"><span class="label" id="lDistance"></span><span id="distance">0 m</span></div>
    <div class="stat"><span class="label" id="lBest"></span><span id="best">0</span></div>
  </div>
  <div class="danger">
    <div class="danger-label" id="lPack"></div>
    <div class="danger-bar"><div id="dangerFill"></div></div>
  </div>
</div>

<!-- ⚠️ ZIP 400 — LE MESSAGE DE SORTIE QUITTE LE HUD ET PASSE AU CENTRE.
     Demande de Guillaume : « l'indication du offroad au centre de l'écran
     comme un message (QUI NE GENE PAS POUR LA VISIBILITE) ».

     Il était collé sous la jauge de meute, en haut à GAUCHE, en 13 px : à
     34 u/s, l'œil est au centre de la piste et n'y va jamais. Une information
     qu'on ne lit pas est une information absente.

     ⚠️ IL EST HORS DU HUD, ET C'EST NÉCESSAIRE. Le HUD est un conteneur en
     colonne aligné en haut à gauche : tout ce qu'on y met hérite de cet
     alignement. Le centrer depuis l'intérieur aurait demandé de défaire la
     colonne, donc de déplacer le score et la jauge avec.

     ⚠️ ET IL VIT DANS LE TIERS SUPÉRIEUR, EN ZONE DE CIEL. C'est la seule
     bande de l'écran où il ne peut RIEN cacher : la piste, les obstacles et
     les loups sont tous sous l'horizon. Voir la mesure de tools/preview-sky.js
     — l'horizon peint tombe aux deux tiers du cadre. -->
<div id="exitHint" class="exit-hint"></div>

<!-- ------------------------------------------- SORTIE OFFROAD (zip 377) --
     Bandeau de la séquence de sortie, et voile du fondu enchaîné. Le voile
     est un simple div : le faire en CSS plutôt qu'en Three.js le garde
     AU-DESSUS du HUD, et surtout il reste noir même si le contexte WebGL est
     perdu au pire moment. -->
<div id="escape" class="layer escape">
  <div class="escape-box">
    <h2 id="eTitle"></h2>
    <p id="eSub"></p>
  </div>
</div>
<div id="fadeVeil"></div>

<!-- ---------------------------------------------------------------- TITRE -->
<div id="title" class="layer panel visible">
  <h1 id="tTitle"></h1>
  <p class="sub" id="tSub"></p>
  <div id="loadError" class="error"></div>
  <button id="btnStart"></button>
  <div class="controls">
    <div id="cLane"></div>
    <div id="cJump"></div>
    <div id="cSlide"></div>
    <div id="cPause"></div>
  </div>
  <p class="hint" id="tHint"></p>
  <p class="hint" id="tHintExit"></p>
  <p class="hint farm" id="tHintFarm"></p>
</div>

<!-- ---------------------------------------------------------------- PAUSE -->
<div id="pause" class="layer panel">
  <h1 id="pTitle"></h1>
  <button id="btnResume"></button>
  <button id="btnQuit" class="ghost"></button>
  <p class="hint" id="pQuitWarn"></p>
</div>

<!-- ------------------------------------------------------------ GAME OVER -->
<div id="gameover" class="layer panel">
  <h1 id="oTitle"></h1>
  <p id="deathReason" class="sub"></p>
  <div id="newBest" class="newbest"></div>
  <div class="results">
    <div><span id="fLScore"></span><b id="finalScore">0</b></div>
    <div><span id="fLCoins"></span><b id="finalCoins">0</b></div>
    <div><span id="fLDistance"></span><b id="finalDistance">0 m</b></div>
    <div><span id="fLBest"></span><b id="finalBest">0</b></div>
  </div>
  <p class="hint" id="oHint"></p>
  <button id="btnBack"></button>
</div>

<!-- three.js : build global classique (pas de module). Chargé ICI, dans
     l'iframe, donc jamais dans le bundle Next de la ferme.

     ⚠️ ZIP 425 — ON PASSE AU LOCAL, comme candyluge au 422. C'est EXACTEMENT
     le même fichier r128 (603 Ko, copié depuis npm three@0.128.0) : zéro
     déplacement de teinte, aucun réglage à revoir. Ce qu'on y gagne :

       * plus de script tiers chargé sans `integrity` (le grief du §10 du
         contexte, qui vaut aussi pour labyrinth — LUI N'EST PAS ENCORE
         MIGRÉ) ;
       * le fichier est partagé avec candyluge, donc déjà dans le cache du
         navigateur dès qu'on a ouvert l'un des deux jeux ;
       * plus de dépendance au réseau au lancement. ⚠️ Ce n'était PAS la cause
         des saccades signalées par Guillaume — mesure faite, la cause est la
         ferme qui repeignait derrière l'iframe (voir FermeGame.js, zip 425) —
         mais une seconde d'attente sur cdnjs se lit comme un jeu qui rame,
         et il n'y a aucune raison de la garder. -->
<script src="/vendor/three-r128/three.min.js"></script>

<!-- Ordre : config.js AVANT bridge.js depuis le zip 377. Le pont valide
     désormais les couleurs de tenue reçues et retombe sur CFG.COL_* quand
     elles manquent ; le faire charger après config lève la dépendance
     temporelle au lieu de parier sur l'ordre d'arrivée des messages. -->
<script src="js/strings.js"></script>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/bridge.js"></script>
<script src="js/input.js"></script>
<script src="js/track.js"></script>
<script src="js/player.js"></script>
<script src="js/wolves.js"></script>
<script src="js/camera.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
